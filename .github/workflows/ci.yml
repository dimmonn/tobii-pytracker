name: Label PR with coverage

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  label:
    name: Update coverage label
    runs-on: ubuntu-latest

    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request'

    steps:
      - name: Find PR number
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;

            if (!run.pull_requests || run.pull_requests.length === 0) {
              core.setFailed("No pull request associated with this workflow run.");
              return;
            }

            core.setOutput(
              "number",
              run.pull_requests[0].number.toString()
            );

      - name: Download coverage artifact
        uses: actions/download-artifact@v4
        with:
          name: coverage-report
          path: coverage
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Calculate coverage label
        id: coverage
        run: |
          python - <<'PY'
          import os
          import xml.etree.ElementTree as ET

          root = ET.parse("coverage/coverage.xml").getroot()
          pct = float(root.attrib["line-rate"]) * 100

          if pct >= 90:
              label = "coverage: excellent (>=90%)"
          elif pct >= 80:
              label = "coverage: good (80-89%)"
          elif pct >= 70:
              label = "coverage: fair (70-79%)"
          else:
              label = "coverage: low (<70%)"

          print(f"Coverage: {pct:.2f}%")
          print(f"Label: {label}")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"label={label}\n")
              f.write(f"pct={pct:.2f}\n")
          PY

      - name: Update PR coverage label
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          KEEP_LABEL: ${{ steps.coverage.outputs.label }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issue_number = Number(process.env.PR_NUMBER);
            const keepLabel = process.env.KEEP_LABEL;

            const coverageLabels = [
              "coverage: excellent (>=90%)",
              "coverage: good (80-89%)",
              "coverage: fair (70-79%)",
              "coverage: low (<70%)",
            ];

            const { data: existing } =
              await github.rest.issues.listLabelsOnIssue({
                owner,
                repo,
                issue_number,
              });

            const existingNames = existing.map(label => label.name);

            for (const name of coverageLabels) {
              if (name !== keepLabel && existingNames.includes(name)) {
                await github.rest.issues.removeLabel({
                  owner,
                  repo,
                  issue_number,
                  name,
                });
              }
            }

            if (!existingNames.includes(keepLabel)) {
              await github.rest.issues.addLabels({
                owner,
                repo,
                issue_number,
                labels: [keepLabel],
              });
            }

            core.info(
              `PR #${issue_number} labeled: ${keepLabel}`
            );