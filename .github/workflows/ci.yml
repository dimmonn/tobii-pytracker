name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python 3.10 tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install headless PsychoPy system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libglu1-mesa \
            libgl1-mesa-dri \
            xvfb

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Upgrade packaging tools
        run: python -m pip install --upgrade pip setuptools wheel

      - name: Install project
        run: python -m pip install -e .

      - name: Install PsychoPy runtime dependency
        run: python -m pip install "psychopy>=2024.1.4,<2025.1.0" --no-deps

      - name: Run unit tests in virtual X display
        env:
          PYTHONUNBUFFERED: "1"
          DISPLAY: ":99"
        run: |
          xvfb-run -a \
            -s "-screen 0 1280x1024x24" \
            python -m unittest discover -s tests -p "test_*.py" -v

  package:
    name: Build package
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Upgrade packaging tools
        run: python -m pip install --upgrade pip setuptools wheel build

      - name: Build distribution
        run: python -m build

      - name: Check distribution contents
        run: python -m pip install twine && python -m twine check dist/*

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: tobii-pytracker-dist
          path: dist/
          if-no-files-found: error
