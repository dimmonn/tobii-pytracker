name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  test:
    name: Python 3.10 tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install headless PsychoPy system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libglu1-mesa \
            libgl1-mesa-dri \
            libegl1 \
            libxkbcommon-x11-0 \
            libdbus-1-3 \
            libxcb-xinerama0 \
            xvfb

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Upgrade packaging tools
        run: |
          python -m pip install --upgrade \
            pip \
            setuptools \
            wheel

      - name: Install project
        run: python -m pip install -e .

      - name: Install test dependencies
        run: |
          python -m pip install \
            pytest \
            pytest-cov \
            pyyaml \
            "scikit-image>=0.24,<0.26"

      - name: Install PsychoPy
        run: |
          python -m pip install "psychopy>=2024.1.4,<2025.1.0"

      - name: Verify PsychoPy installation
        run: |
          python - <<'PY'
          import psychopy
          from psychopy.iohub import launchHubServer

          print("PsychoPy:", psychopy.__file__)
          print("ioHub:", launchHubServer)
          PY

      - name: Ensure test dataset directory exists
        run: mkdir -p datasets

      - name: Run tests with coverage in virtual X display
        env:
          PYTHONUNBUFFERED: "1"
          DISPLAY: ":99"
        run: |
          xvfb-run -a \
            -s "-screen 0 1280x1024x24" \
            pytest tests -v \
              --cov=src/tobii_pytracker \
              --cov-report=term \
              --cov-report=xml:coverage.xml \
              --cov-report=html:htmlcov

      - name: Calculate coverage label
        id: coverage
        run: |
          python - <<'PY'
          import os
          import xml.etree.ElementTree as ET

          root = ET.parse("coverage.xml").getroot()
          pct = float(root.attrib["line-rate"]) * 100

          if pct >= 90:
              label = "coverage: excellent (>=90%)"
              color = "brightgreen"
          elif pct >= 80:
              label = "coverage: good (80-89%)"
              color = "green"
          elif pct >= 70:
              label = "coverage: fair (70-79%)"
              color = "yellow"
          else:
              label = "coverage: low (<70%)"
              color = "red"

          print(f"Coverage: {pct:.2f}%")

          badge_url = (
              f"https://img.shields.io/badge/"
              f"coverage-{pct:.2f}%25-{color}"
          )

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"coverage_pct={pct:.2f}\n")
              f.write(f"coverage_label={label}\n")
              f.write(f"coverage_badge_url={badge_url}\n")
          PY

      - name: Upload coverage XML report
        id: coverage_xml_artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: error

      - name: Upload HTML line coverage report
        id: coverage_html_artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: htmlcov/
          if-no-files-found: error

      - name: Publish coverage summary
        run: |
          COVERAGE_ARTIFACT_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts/${{ steps.coverage_html_artifact.outputs.artifact-id }}"

          echo "### Test coverage: ${{ steps.coverage.outputs.coverage_pct }}%" >> "$GITHUB_STEP_SUMMARY"
          echo "[![Coverage Badge](${{ steps.coverage.outputs.coverage_badge_url }})](${COVERAGE_ARTIFACT_URL})" >> "$GITHUB_STEP_SUMMARY"
          echo "Coverage label: \`${{ steps.coverage.outputs.coverage_label }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "[Open line-level coverage report (HTML)](${COVERAGE_ARTIFACT_URL})" >> "$GITHUB_STEP_SUMMARY"

      - name: Label PR with coverage
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          COVERAGE_LABEL: ${{ steps.coverage.outputs.coverage_label }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issue_number = context.payload.pull_request.number;
            const keepLabel = process.env.COVERAGE_LABEL;

            const coverageLabels = [
              "coverage: excellent (>=90%)",
              "coverage: good (80-89%)",
              "coverage: fair (70-79%)",
              "coverage: low (<70%)",
            ];

            const { data: issue } = await github.rest.issues.get({
              owner,
              repo,
              issue_number
            });

            const currentLabels = issue.labels
              .map(label => typeof label === "string" ? label : label.name)
              .filter(Boolean);

            const newLabels = currentLabels.filter(
              name => !coverageLabels.includes(name)
            );

            if (!newLabels.includes(keepLabel)) {
              newLabels.push(keepLabel);
            }

            await github.rest.issues.setLabels({
              owner,
              repo,
              issue_number,
              labels: newLabels
            });

            core.info(`Set coverage label to: ${keepLabel}`);

  package:
    name: Build package
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Upgrade packaging tools
        run: |
          python -m pip install --upgrade \
            pip \
            setuptools \
            wheel \
            build \
            twine

      - name: Build distribution
        run: python -m build

      - name: Check distribution
        run: python -m twine check dist/*

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: tobii-pytracker-dist
          path: dist/
          if-no-files-found: error